name: gym_app
description: App de Personal Trainer & Nutrição - Gestão de alunos, planos de treino e nutrição.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase (versões atualizadas para Flutter 3.44.x)
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  firebase_crashlytics: ^5.2.6

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod: ^3.3.2

  # Charts
  fl_chart: ^1.2.0

  # Video Player
  video_player: ^2.8.6
  chewie: ^1.7.5

  # Image Picker
  image_picker: ^1.1.2
  image_picker_for_web: ^3.0.0

  # PDF Generation
  pdf: ^3.10.8
  printing: ^5.12.0

  # Pedometer
  pedometer: ^4.0.1

  # Connectivity
  connectivity_plus: ^7.3.1

  # Image Cache
  cached_network_image: ^3.4.0

  # Google Fonts
  google_fonts: ^8.2.1

  # Audio
  just_audio: ^0.10.6

  # Utilities
  intl: ^0.20.0
  cloud_functions: ^6.3.5
  http: ^1.2.0
  path_provider: ^2.1.2
  share_plus: ^13.3.0
  url_launcher: ^6.2.5
  uuid: ^4.3.3
  equatable: ^2.0.5
  record: ^7.1.1
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  mocktail: ^1.0.3
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/

flutter_intl:
  enabled: true
  main_locale: pt
